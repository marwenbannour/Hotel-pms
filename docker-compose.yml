services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://hotel:hotel@db:5432/hotel
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env (voir .env.example)}
      HOTEL_NAME: ${HOTEL_NAME:-Hotel}
      HOTEL_TZ: ${HOTEL_TZ:-Europe/Paris}
      ENABLED_MODULES: ${ENABLED_MODULES:-core}
      # Le serveur web appelle l'API depuis le réseau Docker interne.
      TRUST_PROXY: loopback, uniquelocal
    ports: ["3000:3000"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://api:3000
      # Mettre à true dès que l'application est servie en HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s

volumes:
  pgdata:
