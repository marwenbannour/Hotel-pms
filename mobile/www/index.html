<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <title>Hôtel</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- Démarrage : ouverture directe du serveur enregistré ; sinon, saisie de son adresse. -->
  <main id="checking" class="center" aria-busy="true">
    <img src="icon.svg" alt="" width="72" height="72">
    <p data-t="checking"></p>
  </main>

  <main id="setup" hidden>
    <img src="icon.svg" alt="" width="56" height="56">
    <h1 data-t="title"></h1>
    <p class="soft" data-t="intro"></p>
    <form id="form" novalidate>
      <label for="url" data-t="label"></label>
      <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" dir="ltr"
             placeholder="https://pms.mon-hotel.com" required>
      <p class="hint" data-t="hint"></p>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="submit" type="submit" data-t="connect"></button>
    </form>
  </main>

  <script src="launcher.js"></script>
</body>
</html>
