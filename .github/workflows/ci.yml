name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
          POSTGRES_DB: hotel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - name: Contrat OpenAPI à jour
        env:
          DATABASE_URL: postgres://hotel:hotel@localhost:5432/hotel_test
          JWT_SECRET: ci
        run: |
          npm run openapi
          git diff --exit-code openapi.json || (echo "openapi.json n'est pas à jour : lancez npm run openapi" && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Parcours complets dans un vrai navigateur, sur la pile Docker de production (docker-compose.e2e.yml).
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/e2e/requirements.txt
      - run: pip install -r web/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python web/e2e/run.py
      - name: Captures des scénarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: web/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 14
